<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDURO MOTO | Магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка с навигацией -->
    <header>
        <div class="header-inner">
            <div class="logo" onclick="showScreen('catalog')">🏍️ ENDURO MOTO</div>
            <nav>
                <a href="#" onclick="showScreen('catalog')">Каталог</a>
                <a href="#" onclick="showOrders()">Мои заказы</a>
            </nav>
        </div>
    </header>

    <!-- Баннер -->
    <div class="hero" id="hero-banner">
        <h1>ПОКОРИ БЕЗДОРОЖЬЕ</h1>
        <p>Официальный дилер эндуро мотоциклов и экипировки</p>
    </div>

    <div class="container">
        
        <!-- ЭКРАН 1: КАТАЛОГ -->
        <div id="screen-catalog">
            <h2 class="section-title">🔥 Мотоциклы</h2>
            <div class="grid" id="motos-grid"></div>
            
            <h2 class="section-title">🛡️ Экипировка</h2>
            <div class="grid" id="gear-grid"></div>
        </div>

        <!-- ЭКРАН 2: ДЕТАЛИ ТОВАРА -->
        <div id="screen-product" class="hidden">
            <button class="btn-back" onclick="showScreen('catalog')">← Назад в каталог</button>
            <div class="product-detail" id="product-container"></div>
        </div>

        <!-- ЭКРАН 3: ОФОРМЛЕНИЕ ЗАКАЗА -->
        <div id="screen-checkout" class="hidden">
            <button class="btn-back" onclick="showScreen('catalog')">← Назад в каталог</button>
            <h2 class="section-title">📦 Оформление заказа</h2>
            <div class="checkout-box">
                <p id="checkout-info"></p>
                
                <form id="order-form" novalidate>
                    <div class="form-group">
                        <label>Ваше ФИО:</label>
                        <input type="text" id="name" placeholder="Иванов Иван Иванович">
                        <span class="error-msg" id="error-name"></span>
                    </div>
                    <div class="form-group">
                        <label>Телефон:</label>
                        <input type="tel" id="phone" placeholder="+375 (29) 123-45-67">
                        <span class="error-msg" id="error-phone"></span>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="email" placeholder="example@mail.ru">
                        <span class="error-msg" id="error-email"></span>
                    </div>
                    <button type="submit" class="btn btn-buy">Подтвердить заказ</button>
                </form>
            </div>
        </div>

        <!-- ЭКРАН 4: МОИ ЗАКАЗЫ -->
        <div id="screen-orders" class="hidden">
            <button class="btn-back" onclick="showScreen('catalog')">← Назад в каталог</button>
            <h2 class="section-title">📋 История заказов</h2>
            <div id="orders-list" class="orders-container"></div>
        </div>

    </div>

    <footer>
        <p>© 2026 Enduro Moto. Все права защищены.</p>
        <p>Телефон: +375 (29) 123-45-67</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
